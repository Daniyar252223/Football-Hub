<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Football Hub - Responsive Typography</title>

    <!-- Only CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<header class="simple-header">

    <div class="logo">

        <img src="css/images/logo.png"
             alt="Football Hub Logo"
             onerror="this.src='https://cdn-icons-png.flaticon.com/512/53/53283.png'">

        <span>Football Hub</span>

    </div>

</header>


<main class="task-page">

    <div id="box-1">

        <h1 class="responsive-title">
            Football Hub
        </h1>

        <p class="responsive-text">
            Responsive Typography
        </p>

    </div>


    <section class="typography-content">

        <h2 class="responsive-heading">
            About Football
        </h2>

        <p class="responsive-paragraph">
            Football is one of the most popular sports in the world.
            Our Football Hub provides information about players,
            matches and football clubs.
        </p>

    </section>

</main>


<footer>

    <p>
        Team members: Daribayev Daniyar, Nurbol Kassymbaev
    </p>

</footer>


</body>
</html>
