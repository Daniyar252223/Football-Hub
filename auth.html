<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Hub - Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <nav class="navbar navbar-expand-lg navbar-dark bg-secondary px-3">
            <a class="navbar-brand logo d-flex align-items-center gap-2" href="index.html">
                <img src="css/images/logo.png" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/53/53283.png'" width="30">
                <span>Football Hub</span>
            </a>
            <span id="live-clock" class="text-light ms-3 opacity-75 small d-none d-md-inline"></span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="players.html">Players</a></li>
                    <li class="nav-item"><a class="nav-link" href="matches.html">Matches</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item d-flex align-items-center" id="auth-link">
                        <a class="btn btn-outline-light btn-sm" href="auth.html">Log In</a>
                    </li>
                    <li class="nav-item ms-lg-2">
                        <button id="theme-toggle" class="btn btn-sm btn-warning">🌙 Dark</button>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container my-5" style="max-width: 500px;">
        <div class="card p-4 shadow">
            <ul class="nav nav-tabs mb-4" id="authTab" role="tablist">
                <li class="nav-item w-50 text-center">
                    <button class="nav-link active w-100 fw-bold" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane">Log In</button>
                </li>
                <li class="nav-item w-50 text-center">
                    <button class="nav-link w-100 fw-bold" id="signup-tab" data-bs-toggle="tab" data-bs-target="#signup-pane">Sign Up</button>
                </li>
            </ul>

            <div class="tab-content">
                <!-- Log In Form -->
                <div class="tab-pane fade show active" id="login-pane">
                    <form id="login-form" novalidate>
                        <div id="login-error" class="alert alert-danger d-none"></div>
                        <div class="mb-3">
                            <label for="login-email" class="form-label">Email</label>
                            <input type="text" id="login-email" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="login-pass" class="form-label">Password</label>
                            <input type="password" id="login-pass" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Log In</button>
                    </form>
                </div>

                <!-- Sign Up Form -->
                <div class="tab-pane fade" id="signup-pane">
                    <form id="signup-form" novalidate>
                        <div id="signup-error" class="alert alert-danger d-none"></div>
                        <div class="mb-3">
                            <label for="signup-name" class="form-label">Full Name</label>
                            <input type="text" id="signup-name" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="signup-email" class="form-label">Email</label>
                            <input type="text" id="signup-email" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="signup-phone" class="form-label">Phone (+7...)</label>
                            <input type="text" id="signup-phone" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="signup-pass" class="form-label">Password (Min 8 chars, 1 letter, 1 number)</label>
                            <input type="password" id="signup-pass" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-success w-100">Create Account</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-3 border-top mt-auto">
        <p class="mb-0">Team members: Daribayev Daniyar, Nurbol Kassymbaev</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
