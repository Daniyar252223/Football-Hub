<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Football Hub - Card Group</title>

    <!-- ONLY CSS. NO BOOTSTRAP -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<header class="simple-header">

    <div class="logo">

        <img src="css/images/logo.png"
             alt="Football Hub Logo"
             onerror="this.src='https://cdn-icons-png.flaticon.com/512/53/53283.png'">

        <span>Football Hub</span>

    </div>

</header>


<main class="task-page">

    <div id="box-1">

        <h1>Football Players</h1>

        <p>
            Three popular football players
        </p>

    </div>


    <!-- TASK 2:
         Desktop = 3
         Tablet = 2
         Mobile = 1
         NO BOOTSTRAP -->

    <div class="task2-card-group">


        <div class="task2-card">

            <img src="css/images/player1.jpg"
                 alt="Cristiano Ronaldo">

            <h3>Cristiano Ronaldo</h3>

            <p>Position: Striker</p>

            <p>Goals: 979</p>

        </div>


        <div class="task2-card">

            <img src="css/images/player2.jpeg"
                 alt="Harry Kane">

            <h3>Harry Kane</h3>

            <p>Position: Striker</p>

            <p>Goals: 531</p>

        </div>


        <div class="task2-card">

            <img src="css/images/player3.webp"
                 alt="Kylian Mbappé">

            <h3>Kylian Mbappé</h3>

            <p>Position: Left Winger</p>

            <p>Goals: 429</p>

        </div>


    </div>

</main>


<footer>

    <p>
        Team members: Daribayev Daniyar, Nurbol Kassymbaev
    </p>

</footer>


</body>
</html>
