<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Hub - Contact Us</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <ul class = "nav-menu">
           <li><a href="index.html">Home</a></li>
           <li><a href="players.html">Players</a></li>
           <li><a href="matches.html">Matches</a></li>
           <li><a href="contact.html">Contact</a></li>
        </ul>
    </header>
<main class="absolute">
        <div id="box-1">
            <h1>Contact Us</h1>
            <p>Get in touch with the Football Hub team!</p>
        </div>

        <section class="contact-info">
            <h2>Contact Details</h2>
            <img src="css/images/contact_img.avif" alt="Contact Us" class="Images" style="margin-bottom: 20px;">
            <p><strong>Phone:</strong> +7 (700) 626-10-07  +7 (776) 231-80-28</p>
            <p><strong>Discord:</strong> drakula_12, nubas123.</p>
        </section>

        <section style="margin-top: 30px;">
            <h2>Send Us a Message</h2>
            <form class="contact-form">
                <div class="form-group">
                    <label for="name" style="color: #333333;">Your Name:</label><br>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>
                
                <div class="form-group">
                    <label for="email" style="color: #333333;">Your Email:</label><br>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="message" style="color: #333333;">Message:</label><br>
                    <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Team members: Daribayev Daniyar, Nurbol Kassymbaev</p>
    </footer>
</body>
</html>
