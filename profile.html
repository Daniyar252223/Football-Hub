<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Hub - User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <nav class="navbar navbar-expand-lg navbar-dark bg-secondary px-3">
            <a class="navbar-brand logo d-flex align-items-center gap-2" href="index.html">
                <img src="css/images/logo.png" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/53/53283.png'" width="30">
                <span>Football Hub</span>
            </a>
            <span id="live-clock" class="text-light ms-3 opacity-75 small d-none d-md-inline"></span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="players.html">Players</a></li>
                    <li class="nav-item"><a class="nav-link" href="matches.html">Matches</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item d-flex align-items-center" id="auth-link">
                        <a class="btn btn-outline-info btn-sm" href="profile.html">Profile</a>
                    </li>
                    <li class="nav-item ms-lg-2">
                        <button id="theme-toggle" class="btn btn-sm btn-warning">🌙 Dark</button>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container my-5" style="max-width: 600px;">
        <div class="card p-4 shadow">
            <h2 class="card-title mb-3">User Profile</h2>
            <hr>
            <div class="mb-3">
                <strong>Full Name:</strong> <span id="profile-name"></span>
            </div>
            <div class="mb-3">
                <strong>Email:</strong> <span id="profile-email"></span>
            </div>
            <div class="mb-3">
                <strong>Phone:</strong> <span id="profile-phone"></span>
            </div>
            <div class="mb-3">
                <strong>Recent Searches:</strong> <span id="profile-history">None</span>
            </div>
            <button id="logout-btn" class="btn btn-danger mt-3">Log Out</button>
        </div>
    </main>

    <footer class="text-center py-3 border-top mt-auto">
        <p class="mb-0">Team members: Daribayev Daniyar, Nurbol Kassymbaev</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
